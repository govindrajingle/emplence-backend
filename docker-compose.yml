# Local development database only.
#
# TLS is intentionally not configured here: the stock PostgreSQL image serves
# plain connections, which is why `.env.local.example` sets DB_SSL_MODE=disable.
# Hosted/production databases must use DB_SSL_MODE=require (see .env.example).
#
#   docker compose up -d      # start (host port 5433 by default)
#   docker compose down       # stop (data is kept in the named volume)
#   docker compose down -v    # stop and delete the data volume
services:
  postgres:
    image: postgres:18
    container_name: emplence-postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: emplence
      POSTGRES_PASSWORD: emplence
      POSTGRES_DB: default
    ports:
      # Default 5433 on the host to avoid clashing with an existing local
      # PostgreSQL on 5432. Override with LOCAL_DB_PORT=5432 if 5432 is free.
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker,
      # so the volume is mounted at the parent directory.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U emplence -d default"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres18-data:
